name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: foundry-rs/foundry-toolchain@v1
      - run: forge build
        working-directory: contracts
      - run: forge test
        working-directory: contracts

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  db:
    # Runs the DB tests (RLS, immutability, CAS, encryption, handlers) against a throwaway local Supabase. Never the cloud projects.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,realtime,storage-api,inbucket,mailpit
      - name: Export local Supabase settings and a throwaway data key
        run: |
          supabase status -o env > /tmp/supabase.env
          TEST_DATA_KEY=$(openssl rand -base64 48)
          TEST_WAITLIST_SECRET=$(openssl rand -base64 32)
          echo "::add-mask::$TEST_DATA_KEY"
          echo "::add-mask::$TEST_WAITLIST_SECRET"
          {
            echo "SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_URL=$(grep '^API_URL=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "SUPABASE_SERVICE_ROLE_KEY=$(grep '^SERVICE_ROLE_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$(grep '^ANON_KEY=' /tmp/supabase.env | cut -d= -f2- | tr -d '"')"
            echo "DATA_ENCRYPTION_KEY=$TEST_DATA_KEY"
            echo "OPENROUTER_API_KEY=unused-in-db-tests"
            echo "WAITLIST_SECRET=$TEST_WAITLIST_SECRET"
            echo "SITE_MODE=app"
          } >> "$GITHUB_ENV"
      - run: npm run test:db
      - name: Build the app against isolated services
        run: npm run build
        env:
          SITE_URL: http://127.0.0.1:3000
      - run: npx playwright install --with-deps chromium
      - name: Browser SIMULATION workflow
        run: npm run test:e2e
